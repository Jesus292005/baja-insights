name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Validate mocks and generated data against the contracts
        run: python -m baja_insights validate mocks/events_sample.json mocks/insights_sample.json mocks/overlays_sample.json data/m001/events.jsonl data/m001/insights.json
      - name: Generated demo match is up to date
        run: |
          python -m baja_insights generate --seed 44 --script m001 --out /tmp/events.jsonl
          diff -q /tmp/events.jsonl data/m001/events.jsonl

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" -r agents/requirements.txt -r agents/requirements-dev.txt
      - name: Agent tests, offline with fake agents and a real MCP client
        env:
          REQUIRE_MCP_CLIENT: "1"
        run: python -m pytest -q agents/tests
      - name: Demo overlays match the contract
        run: python -m baja_insights validate data/m001/overlays.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck and unit tests
        run: npm run typecheck && npm test
      - name: Build, with the demo match bundled from data/m001
        run: npm run build
