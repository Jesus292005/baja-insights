name: Chat image

# Builds chat.Dockerfile ("Ask the match", POST /api/ask) and publishes it to GitHub Container Registry,
# the same way as the stream image. Pull requests only build it.

on:
  push:
    branches: [main]
    paths: ["agents/baja_agents/**", "agents/requirements.txt", "src/**", "data/**", "mocks/**", "contracts/**",
            "chat.Dockerfile", "chat.Dockerfile.dockerignore", ".github/workflows/chat-image.yml"]
  pull_request:
    paths: ["agents/baja_agents/**", "agents/requirements.txt", "src/**", "data/**", "mocks/**", "contracts/**",
            "chat.Dockerfile", "chat.Dockerfile.dockerignore", ".github/workflows/chat-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/baja-chat
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: chat.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
