name: Web deploy

# Builds the UI (web/) and publishes it to Azure Static Web Apps (baja-web, docs/despliegue.md).
# The build reads ../data and ../mocks, so it runs on the whole repository. Pull requests only test
# and build it. Publishing needs the AZURE_STATIC_WEB_APPS_API_TOKEN secret; until it exists, the
# deploy step is skipped with a notice instead of failing.

on:
  push:
    branches: [main]
    paths: ["web/**", "data/**", "mocks/**", "contracts/**", ".github/workflows/web-deploy.yml"]
  pull_request:
    paths: ["web/**", "data/**", "mocks/**", "contracts/**", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Build, with the match without a script (data/f091)
        # Tests above run on the scripted demo m001; the published page shows f091.
        env:
          BAJA_MATCH: f091
        run: npm run build
      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request' && env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
      - name: Deploy skipped, no token yet
        if: github.event_name != 'pull_request' && env.HAS_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so nothing was published. See docs/despliegue.md."
