[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baja-insights"
version = "0.1.0"
description = "Synthetic football match generator and deterministic insight engine for AI-powered match intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baja-Insights team" }]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.20", "pytest>=8"]

[project.scripts]
baja-insights = "baja_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"baja_insights.generator" = ["scripts/*.json", "tactics.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
